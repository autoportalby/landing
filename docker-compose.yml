services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://vrum:vrum@db:5432/vrum?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vrum
      POSTGRES_PASSWORD: vrum
      POSTGRES_DB: vrum
    ports:
      - "5432:5432"
    volumes:
      - vrum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrum -d vrum"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vrum-pgdata:
